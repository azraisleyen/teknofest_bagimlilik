name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  quality:
    name: Quality and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy apps clients/python
      - name: Run tests with coverage
        run: python -m pytest --cov=apps --cov=clients --cov-report=term-missing
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django system checks
        run: python manage.py check
      - name: Generate and validate OpenAPI
        run: |
          python manage.py spectacular --file openapi.yaml --validate
          openapi-spec-validator openapi.yaml

  package:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - name: Install build tooling
        run: python -m pip install --upgrade pip build==1.3.0 twine==6.1.0
      - name: Build sdist and wheel in isolation
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify wheel contents and imports in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/sentra-wheel-test
          /tmp/sentra-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/sentra-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/sentra-wheel-test/bin/python -m pip check
          /tmp/sentra-wheel-test/bin/python - <<'PY'
          from importlib.resources import files
          import apps
          import config
          import sentra_qr_client

          schema = files("apps.qr.schemas.v1").joinpath("content-started.schema.json")
          assert schema.is_file(), "Versioned event schema is missing from the wheel"
          print("Clean wheel import and packaged-resource checks passed")
          PY

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - name: Install audited environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt
          python -m pip check
      - name: Static security scan
        run: python -m bandit -r apps clients -x '*/migrations/*'
      - name: Dependency vulnerability scan
        run: python -m pip_audit --strict -r requirements/production.txt
      - name: Assess production Django settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret-with-sufficient-length
          TOKEN_KEY_V1: ci-only-token-key-with-at-least-thirty-two-bytes
          ALLOWED_HOSTS: example.invalid
          POSTGRES_DB: sentra_ci
          POSTGRES_USER: sentra_ci
          POSTGRES_PASSWORD: ci-placeholder-not-used-for-a-connection
          POSTGRES_HOST: localhost
          ENABLE_DEMO_UI: "False"
          ADMIN_MFA_REQUIRED: "True"
        run: python manage.py check --deploy
