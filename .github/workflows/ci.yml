name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality and tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/development.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy apps clients/python
      - run: python -m pytest --cov=apps --cov=clients --cov-report=term-missing
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py spectacular --file openapi.yaml --validate

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/development.txt
      - run: python -m bandit -r apps clients -x "*/migrations/*"
      - run: python -m pip_audit -r requirements/production.txt

  distribution:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/development.txt
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel in an isolated environment
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m venv /tmp/sentra-wheel-venv
          /tmp/sentra-wheel-venv/bin/python -m pip install "$wheel"
          cd /tmp
          /tmp/sentra-wheel-venv/bin/python - <<'PY'
          import importlib.metadata
          import json
          from importlib.resources import files

          import apps.qr
          import config
          import sentra_qr_client

          schema = files("apps.qr").joinpath("schemas", "v1", "content-started.schema.json")
          assert json.loads(schema.read_text(encoding="utf-8"))["type"] == "object"
          assert importlib.metadata.version("sentra-qr-system") == "1.0.0"
          assert apps.qr and config and sentra_qr_client
          PY
      - name: Reject unintended top-level packages
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          forbidden = {"contracts", "docs", "static", "templates", "tests"}
          with ZipFile(wheel) as archive:
              roots = {PurePosixPath(name).parts[0] for name in archive.namelist()}
          assert roots.isdisjoint(forbidden), roots & forbidden
          PY
