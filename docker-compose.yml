services:
 app:
  build: .
  env_file: .env
  ports: ["8000:8000"]
  depends_on: {db: {condition: service_healthy}}
  restart: unless-stopped
 db:
  image: postgres:17-alpine
  environment: {POSTGRES_DB: sentra, POSTGRES_USER: sentra, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"}
  volumes: ["postgres_data:/var/lib/postgresql/data"]
  healthcheck: {test: ["CMD-SHELL", "pg_isready -U sentra"], interval: 5s, timeout: 3s, retries: 10}
 redis:
  image: redis:8-alpine
  command: ["redis-server","--appendonly","yes"]
  profiles: ["redis"]
volumes: {postgres_data: {}}
