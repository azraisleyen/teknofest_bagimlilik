[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-qr-system"
version = "1.0.0"
description = "Secure modular QR support, referral, and research system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "Django==5.2.5", "djangorestframework==3.16.1", "drf-spectacular==0.28.0",
 "qrcode==8.2", "Pillow==11.3.0", "jsonschema==4.25.1", "gunicorn==23.0.0",
 "psycopg[binary]==3.2.9", "django-redis==6.0.0", "redis==6.4.0", "django-csp==4.0",
 "django-otp==1.6.1", "httpx==0.28.1"
]


[tool.setuptools.packages.find]
where = [".", "clients/python"]
include = ["apps*", "config*", "sentra_qr_client*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
"apps.qr" = ["schemas/v1/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["apps/*/migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "DJ"]
ignore = ["S101", "S105", "S311", "DJ008", "F405", "E501"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
[tool.django-stubs]
django_settings_module = "config.settings.test"
