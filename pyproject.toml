[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-qr-system"
version = "1.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "Django==5.2.16", "djangorestframework==3.16.1", "drf-spectacular==0.28.0",
 "qrcode==8.2", "Pillow==12.3.0", "jsonschema==4.25.1", "gunicorn==23.0.0",
 "psycopg[binary]==3.2.9", "django-redis==6.0.0", "redis==6.4.0", "django-csp==4.0",
 "django-otp==1.6.1", "httpx==0.28.1"
]

[tool.setuptools]
package-dir = {sentra_qr_client = "clients/python/sentra_qr_client"}
include-package-data = false
packages = [
 "apps", "apps.audit", "apps.audit.migrations", "apps.core", "apps.core.migrations",
 "apps.content", "apps.content.management", "apps.content.management.commands", "apps.content.migrations",
 "apps.display", "apps.display.migrations",
 "apps.demo", "apps.demo.migrations", "apps.devices", "apps.devices.management",
 "apps.devices.management.commands", "apps.devices.migrations", "apps.interactions",
 "apps.interactions.management", "apps.interactions.management.commands",
 "apps.interactions.migrations", "apps.qr", "apps.qr.management",
 "apps.qr.management.commands", "apps.qr.migrations", "apps.support",
 "apps.support.migrations", "apps.surveys", "apps.surveys.management",
 "apps.surveys.management.commands", "apps.surveys.migrations", "apps.yedam",
 "apps.yedam.management", "apps.yedam.management.commands", "apps.yedam.migrations",
 "config", "config.settings", "sentra_qr_client",
]

[tool.setuptools.package-data]
"apps.qr" = ["schemas/v1/*.json"]
"apps.support" = ["static/css/*.css", "static/js/*.js", "templates/support/*.html"]
"apps.demo" = ["templates/demo/*.html"]
"apps.content" = ["static/content/young_adult/*"]
"apps.display" = ["static/display/css/*.css", "static/display/js/core/*.js", "static/display/js/adapters/*.js", "static/display/js/media/*.js", "static/display/js/qr/*.js", "static/display/media/*", "templates/display/*.html"]
"apps.surveys" = ["static/surveys/*.css", "static/surveys/*.js", "templates/surveys/*.html"]
"apps.yedam" = ["static/yedam/*.js"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["apps/*/migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "DJ"]
ignore = ["S101", "S105", "S311", "DJ008", "F405", "E501"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["^apps/[^/]+/migrations/.*\\.py$"]
ignore_missing_imports = true
check_untyped_defs = true
[tool.django-stubs]
django_settings_module = "config.settings.test"
