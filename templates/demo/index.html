{% load static %}<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SENTRA Simulator</title><link rel="stylesheet" href="{% static 'css/support.css' %}"></head><body><main><p class="eyebrow">TEMPORARY QR INTEGRATION SIMULATOR</p><h1>SENTRA QR Durum Simülatörü</h1><section><p>Kamera, algılama ve animasyon alanları yalnızca yer tutucudur. AI işlevi yoktur.</p></section><form method="post" action="simulate">{% csrf_token %}<label>Cihaz <select name="device">{% for d in devices %}<option value="{{d.device_id}}">{{d.device_name}}</option>{% endfor %}</select></label><label>İçerik <input name="content_id" value="demo-content"></label><button name="action" value="start">CONTENT_STARTED</button><button name="action" value="end">CONTENT_ENDED</button><button name="action" value="failure">Hata / Genel QR</button></form><section><h2>Sabit QR kartı</h2><img width="240" height="240" src="/static/qr/general.svg" alt="YEDAM genel destek QR kodu"><strong>YEDAM 115</strong></section><section aria-live="polite"><h2>Olay geçmişi</h2>{% for event in events %}<p>{{event}}</p>{% endfor %}</section></main></body></html>
